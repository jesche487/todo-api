<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>todo.</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;background:#f5f2eb;min-height:100vh;padding:2rem 1rem}
.app{max-width:560px;margin:0 auto}
.header{margin-bottom:2rem}
.header h1{font-family:'DM Serif Display',serif;font-size:2.8rem;color:#1a1a1a;line-height:1;letter-spacing:-1px}
.header p{font-size:11px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.stats{display:flex;gap:12px;margin-bottom:1.5rem}
.stat{background:#fff;border:0.5px solid #e0ddd6;border-radius:10px;padding:12px 16px;flex:1}
.stat-num{font-size:1.6rem;font-weight:500;color:#1a1a1a;font-family:'DM Serif Display',serif}
.stat-label{font-size:10px;color:#999;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.input-row{display:flex;gap:8px;margin-bottom:1.5rem}
.input-row input{flex:1;padding:12px 16px;border:0.5px solid #d4d0c8;border-radius:10px;font-family:'DM Mono',monospace;font-size:13px;background:#fff;color:#1a1a1a;outline:none;transition:border-color .15s}
.input-row input:focus{border-color:#888}
.input-row input::placeholder{color:#bbb}
.input-row button{padding:12px 20px;background:#1a1a1a;color:#f5f2eb;border:none;border-radius:10px;font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.input-row button:hover{opacity:.8}
.filters{display:flex;gap:6px;margin-bottom:1rem}
.filter-btn{padding:6px 14px;border:0.5px solid #d4d0c8;border-radius:20px;background:#fff;font-family:'DM Mono',monospace;font-size:11px;color:#888;cursor:pointer;transition:all .15s}
.filter-btn.active{background:#1a1a1a;color:#f5f2eb;border-color:#1a1a1a}
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo-item{background:#fff;border:0.5px solid #e0ddd6;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:opacity .2s}
.todo-item.done{opacity:.5}
.todo-item.done .todo-title{text-decoration:line-through;color:#aaa}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid #d4d0c8;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff}
.check:hover{border-color:#888}
.check.checked{background:#1a1a1a;border-color:#1a1a1a}
.check.checked::after{content:'✓';font-size:11px;color:#f5f2eb}
.todo-title{flex:1;font-size:13px;color:#1a1a1a;line-height:1.4;word-break:break-word;overflow-wrap:break-word;}.todo-meta{font-size:10px;color:#bbb;margin-top:3px;letter-spacing:.5px}
.delete-btn{width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:#ccc;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.delete-btn:hover{background:#fef2f2;color:#e24b4a}
.empty{text-align:center;padding:3rem 0;color:#bbb;font-size:12px;letter-spacing:1px}
.progress-bar{height:3px;background:#ede9e1;border-radius:2px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:#1a1a1a;border-radius:2px;transition:width .3s ease}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>todo.</h1>
    <p>your tasks, simplified</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="total-count">0</div><div class="stat-label">total</div></div>
    <div class="stat"><div class="stat-num" id="done-count">0</div><div class="stat-label">done</div></div>
    <div class="stat"><div class="stat-num" id="left-count">0</div><div class="stat-label">remaining</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="input-row">
    <input type="text" id="new-todo" placeholder="add a new task..." maxlength="200" />
    <button onclick="addTodo()">+ add</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">all</button>
    <button class="filter-btn" onclick="setFilter('active',this)">active</button>
    <button class="filter-btn" onclick="setFilter('done',this)">done</button>
  </div>
  <div class="todo-list" id="todo-list">
    <div class="empty" id="empty-state">no tasks yet — add one above</div>
  </div>
</div>

<script>
let todos=[];
let filter='all';

function fmt(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function updateStats(){
  const total=todos.length;
  const done=todos.filter(t=>t.completed).length;
  const left=total-done;
  document.getElementById('total-count').textContent=total;
  document.getElementById('done-count').textContent=done;
  document.getElementById('left-count').textContent=left;
  const pct=total===0?0:Math.round((done/total)*100);
  document.getElementById('progress').style.width=pct+'%';
}

function render(){
  const list=document.getElementById('todo-list');
  const filtered=todos.filter(t=>{
    if(filter==='active') return !t.completed;
    if(filter==='done') return t.completed;
    return true;
  });

  if(filtered.length===0){
    list.innerHTML='<div class="empty">no tasks here — add one above</div>';
    updateStats();
    return;
  }

  list.innerHTML='';
  filtered.forEach(t=>{
    const item=document.createElement('div');
    item.className='todo-item'+(t.completed?' done':'');
    item.innerHTML=`
      <div class="check${t.completed?' checked':''}" onclick="toggleTodo(${t.id})"></div>
      <div style="flex:1">
        <div class="todo-title">${t.title}</div>
        <div class="todo-meta">added ${fmt(t.created_at)}</div>
      </div>
      <button class="delete-btn" onclick="deleteTodo(${t.id})" aria-label="delete">✕</button>
    `;
    list.appendChild(item);
  });
  updateStats();
}

async function loadTodos(){
  const r=await fetch('/api/todos/');
  todos=await r.json();
  render();
}

async function addTodo(){
  const input=document.getElementById('new-todo');
  const title=input.value.trim();
  if(!title) return;
  try{
    const r=await fetch('/api/todos/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,completed:false})});
    if(!r.ok) throw new Error('Server error');
    const t=await r.json();
    todos.unshift(t);
    input.value='';
    render();
  }catch(e){
    input.style.borderColor='#e24b4a';
    input.placeholder='connection error — try again';
    input.value='';
    setTimeout(()=>{
      input.style.borderColor='';
      input.placeholder='add a new task...';
    },3000);
  }
}

async function toggleTodo(id){
  const todo=todos.find(t=>t.id===id);
  if(!todo) return;
  const r=await fetch('/api/todos/'+id+'/',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...todo,completed:!todo.completed})});
  const updated=await r.json();
  todos=todos.map(t=>t.id===id?updated:t);
  render();
}

async function deleteTodo(id){
  await fetch('/api/todos/'+id+'/',{method:'DELETE'});
  todos=todos.filter(t=>t.id!==id);
  render();
}

function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

document.getElementById('new-todo').addEventListener('keydown',e=>{if(e.key==='Enter') addTodo();});
loadTodos();
</script>

</body>
</html>
